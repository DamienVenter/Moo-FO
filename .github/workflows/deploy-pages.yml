name: Deploy MOO-FO to GitHub Pages

# Mirrors the pushed branch onto gh-pages; GitHub Pages serves that branch.
on:
  push:
    branches: [main, master, claude/eloquent-meitner-3kdjhg]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git push origin HEAD:gh-pages --force
