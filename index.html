<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0b1026" />
  <title>MOO-FO 🛸 Abduct All The Cows</title>
  <meta name="description" content="MOO-FO — a 90-second voxel UFO cow-abduction arcade game. Beam up cows, dodge farmers, beat your high score." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>🛸</text></svg>" />
  <link rel="stylesheet" href="css/style.css" />
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.min.js" } }
  </script>
</head>
<body>
  <canvas id="game-canvas"></canvas>
  <!-- Instant loading screen (inline-styled so it paints before any CSS/JS or
       the heavy world build; main.js fades it out once the first frame is ready). -->
  <div id="mf-loading" style="position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 38%,#1a2350,#0b1026 70%);color:#7cfc9a;font-family:system-ui,-apple-system,sans-serif;transition:opacity .5s ease">
    <div style="font-size:46px;font-weight:900;letter-spacing:3px;color:#ffd24a;text-shadow:0 3px 0 #7a5a18,0 0 22px rgba(255,210,74,.4)">MOO&middot;FO</div>
    <div style="margin-top:20px;width:46px;height:46px;border:5px solid rgba(124,252,154,.22);border-top-color:#7cfc9a;border-radius:50%;animation:mfspin .9s linear infinite"></div>
    <div style="margin-top:14px;font-size:12px;letter-spacing:2px;opacity:.65">LOADING&hellip;</div>
  </div>
  <style>@keyframes mfspin{to{transform:rotate(360deg)}}</style>
  <noscript>MOO-FO needs JavaScript to fly.</noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
